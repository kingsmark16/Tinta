name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tinta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tinta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tinta_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          pnpm --filter api exec prisma validate
          pnpm --filter api exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Check API types
        run: pnpm --filter api exec tsc --noEmit --incremental false

      - name: Lint API
        run: pnpm --filter api run lint

      - name: Check API formatting
        run: pnpm --filter api exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Test API units
        run: pnpm --filter api run test

      - name: Test API HTTP
        run: pnpm --filter api run test:e2e
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Check mobile types
        run: pnpm --filter mobile exec tsc --noEmit --incremental false
