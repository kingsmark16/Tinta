name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API types
        run: pnpm --filter api exec tsc --noEmit --incremental false

      - name: Lint API
        run: pnpm --filter api run lint

      - name: Check API formatting
        run: pnpm --filter api exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Test API units
        run: pnpm --filter api run test

      - name: Test API HTTP
        run: pnpm --filter api run test:e2e

      - name: Check mobile types
        run: pnpm --filter mobile exec tsc --noEmit
